# cost101 como Worker de Cloudflare. Mismo patrón que master101 (D1 y D2).
# Dos Workers con el mismo código: `cost101-staging` (API de staging) y
# `cost101` (producción, en cost101.taller101.com).
# Las llaves no están aquí: publica el corredor con los secretos de Actions.

name = "cost101"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# `workers_dev = true` va junto a `routes`: sin él wrangler apaga workers.dev.
workers_dev = true
routes = [
  { pattern = "cost101.taller101.com", custom_domain = true }
]

[vars]
DOMINIO_PROPIO = "cost101.taller101.com"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# Todo pasa por el Worker, para que la redirección de workers.dev corra.
run_worker_first = true

[[services]]
binding = "API"
service = "suite101-api"

[observability]
enabled = true

# ─────────────── staging ───────────────
[env.staging]
name = "cost101-staging"
routes = []

[env.staging.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/s101/*"]

[[env.staging.services]]
binding = "API"
service = "suite101-api-staging"

[env.staging.observability]
enabled = true
