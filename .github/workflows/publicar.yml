# Publica cost101 en Cloudflare y luego mide lo que publicó.
#
# Orden: la pantalla contra una suite101-api de verdad levantada aquí mismo →
# staging → medir + la pantalla contra staging → producción → medir. Lo medido
# vuelve como comentario del commit (OPERAR.md §6).
#
# En producción se mira, no se toca: ahí la prueba de pantalla NO corre,
# porque da de alta una empresa de prueba y eso sólo existe fuera de producción.
#
# Secretos del repositorio (los mismos valores que master101 y peek101):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Publicar cost101

on:
  push:
    branches: [main]
    paths-ignore:
      - 'claude/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write          # para dejar el comentario en el commit

concurrency:
  group: despliegue-cost101
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CORREO_SUPERADMIN: ${{ vars.CORREO_SUPERADMIN || 'mike@forespot.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Comprobar que hay con qué publicar
        run: |
          falta=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || falta="$falta CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || falta="$falta CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$falta" ]; then
            {
              echo "FALTA CON QUÉ PUBLICAR"
              echo
              echo "Secretos que el repositorio cost101 no tiene:$falta"
              echo "Los pone Mike, una sola vez, en:"
              echo "  github.com/mikebalcazar/cost101/settings/secrets/actions"
              echo "Son los MISMOS valores que ya tienen master101 y peek101."
              echo "No se publicó nada."
            } | tee /tmp/medido-local.txt
            echo "::error::Faltan secretos del repositorio cost101:$falta"
            exit 1
          fi
          echo "los dos secretos están puestos"

      - name: Que el JavaScript compile
        run: |
          set -euo pipefail
          for f in worker/index.js scripts/*.mjs pruebas/*.mjs public/support.js public/entrar.js; do node --check "$f"; done
          node scripts/logica.mjs
          node --test pruebas/dominio.spec.mjs
          echo "todo pasa node --check"

      - name: Traer el navegador
        run: npx playwright install --with-deps chromium

      # La pantalla se prueba contra la API DE VERDAD, no contra una de
      # mentiras: se trae suite101-api (es pública), se levanta aquí con su
      # base local, y cost101 le habla por el mismo puente que en Cloudflare.
      - name: Traer y levantar suite101-api
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/mikebalcazar/suite101-api /tmp/suite101-api
          cd /tmp/suite101-api
          echo "suite101-api en $(git rev-parse --short HEAD)"
          npm ci --silent
          npx wrangler d1 migrations apply suite101-master-staging --local --env staging > /tmp/api-migraciones.txt 2>&1 || { tail -20 /tmp/api-migraciones.txt; exit 1; }
          CLOUDFLARE_API_TOKEN= CLOUDFLARE_ACCOUNT_ID= nohup npx wrangler dev --env staging --local --port 8787 > /tmp/api-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/salud > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8787/salud || { tail -40 /tmp/api-dev.log; exit 1; }

      - name: La pantalla, contra la API levantada aquí
        run: |
          set -uo pipefail
          node pruebas/servidor.mjs 8796 http://127.0.0.1:8787 &
          sleep 2
          BASE=http://127.0.0.1:8796 API=http://127.0.0.1:8787 node pruebas/pantalla.spec.mjs 2>&1 | tee /tmp/medido-local.txt

      - name: Sellar con este commit
        run: node scripts/sellar.mjs "${{ github.sha }}"

      # ── staging ──────────────────────────────────────────────────────────
      - name: Publicar staging
        id: staging
        run: |
          set -euo pipefail
          npx wrangler deploy --env staging | tee /tmp/staging.txt
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/staging.txt | head -1)
          [ -n "$url" ] || { echo 'no pude sacar la liga de la salida de wrangler' >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Medir staging
        env:
          STAGING: ${{ steps.staging.outputs.url }}
          VERSION_ESPERADA: ${{ github.sha }}
        run: |
          set -uo pipefail
          node scripts/medir.mjs 2>&1 | tee /tmp/medido-staging.txt

      - name: La pantalla con un navegador, contra staging
        env:
          BASE: ${{ steps.staging.outputs.url }}
          API: https://suite101-api-staging.mike-929.workers.dev
        run: |
          set -uo pipefail
          node pruebas/pantalla.spec.mjs 2>&1 | tee -a /tmp/medido-staging.txt

      # ── producción ───────────────────────────────────────────────────────
      # Sólo si staging salió bien.
      - name: Publicar producción
        id: produccion
        run: |
          set -euo pipefail
          npx wrangler deploy | tee /tmp/prod.txt
          echo "url=https://cost.suite101.app" >> "$GITHUB_OUTPUT"

      - name: Medir producción
        env:
          PROD: ${{ steps.produccion.outputs.url }}
          VERSION_ESPERADA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # El certificado del dominio nuevo puede tardar la primera vez.
          for i in $(seq 1 30); do curl -sf -o /dev/null "$PROD/huella.txt" && break; sleep 10; done
          node scripts/medir.mjs 2>&1 | tee /tmp/medido-prod.txt

      - name: Dejar lo medido en el commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          : > /tmp/salida.txt
          for f in /tmp/medido-local.txt /tmp/medido-staging.txt /tmp/medido-prod.txt; do
            [ -f "$f" ] && { echo "--- $(basename "$f" .txt) ---"; cat "$f"; echo; } >> /tmp/salida.txt
          done
          [ -s /tmp/salida.txt ] || echo "No hubo salida que reportar: el flujo se cayó antes de medir." > /tmp/salida.txt
          jq -Rs '{body: ("**cost101 como Worker**\n\n```\n" + .[-60000:] + "\n```")}' /tmp/salida.txt > /tmp/comentario.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            -d @/tmp/comentario.json -o /tmp/respuesta.json -w 'comentario: %{http_code}\n'
